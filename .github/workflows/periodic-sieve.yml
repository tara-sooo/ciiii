name: Unbounded multiplier CRT sieve tests
on:
  push:
    branches: [main]
    paths:
      - 'src/periodic_sieve.py'
      - 'src/elliptic_sieve.py'
      - '.github/workflows/periodic-sieve.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 src/periodic_sieve.py --self-test
